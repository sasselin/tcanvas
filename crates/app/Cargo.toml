[package]
name = "tcanvas"
description = "WSL terminals as cards on an infinite canvas"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links"] }
egui = { version = "0.37", features = ["serde", "monochrome_emoji_fonts"] }
alacritty_terminal = "0.26"
uuid = { version = "1", features = ["v4"] }
directories = "6"
nucleo-matcher = "0.3"
# Clipboard reading (text and images) for Ctrl+Shift+V and right-click paste (egui only reads it for Ctrl+V).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Encodes pasted clipboard images, saved to a file whose path is pasted into the terminal.
png = "0.18"
sys-locale = "0.3"
# Update check and download from GitHub releases (rustls, no system TLS needed).
ureq = "3"
# Checks downloaded updates against the release's SHA256SUMS.
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

# Desktop notifications on native Linux (freedesktop D-Bus, pure Rust).
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# PNG output for the README screenshots (tests/screenshots.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
