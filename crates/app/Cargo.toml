[package]
name = "tcanvas"
edition.workspace = true
version.workspace = true

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
egui = { version = "0.37", features = ["serde", "monochrome_emoji_fonts"] }
alacritty_terminal = "0.26"
uuid = { version = "1", features = ["v4"] }
directories = "6"
nucleo-matcher = "0.3"
# Clipboard reading for Ctrl+Shift+V and right-click paste (egui only reads it for Ctrl+V).
arboard = { version = "3.6", default-features = false }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# PNG output for the README screenshots (tests/screenshots.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
