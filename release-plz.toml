# release-plz: on every push to main, keeps a "chore: release" PR up to date (version bump in
# Cargo.toml + CHANGELOG.md from Conventional Commits). Merging it tags `vX.Y.Z` and creates the
# GitHub release; .github/workflows/release.yml then builds and attaches the binaries.
# Nothing goes to crates.io: versions come from git tags.

# Every package takes part, so that a change in the agent or the protocol alone opens a release
# PR: `changelog_include` below only sees packages release-plz works on (a package with
# `release = false` is dropped and its commits are silently ignored). They all share one version
# (`version.workspace`) and one tag; only `tcanvas` creates it, the GitHub release and the
# changelog.
[workspace]
git_only = true
publish = false
semver_check = false
pr_labels = ["release"]
# Capitalized like every other subject (checked by ci.yml and scripts/git-hooks).
pr_name = "chore: Release v{{ version }}"
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

# The workspace is released as `tcanvas`.
[[package]]
name = "tcanvas"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["tcanvas-agent", "protocol"]
git_tag_enable = true
git_release_name = "v{{ version }}"
git_release_enable = true
