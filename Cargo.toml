[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
