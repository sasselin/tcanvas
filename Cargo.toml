[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sasselin/tcanvas"
authors = ["Sebastien Asselin"]
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
